name: Notebooks CPU

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notebooks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notebooks-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Installer l'environnement CPU
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Vérifier les cellules Colab et la structure
        run: |
          python scripts/prepare_notebooks.py --check
          python scripts/validate_notebooks.py
      - name: Exécuter les cinq TP dans des noyaux indépendants
        run: python scripts/validate_notebooks.py --execute
      - name: Vérifier les archives distribuées
        run: python scripts/build_packs.py --check
      - name: Conserver les résultats de validation
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: notebooks-cpu
          path: .build/notebook-checks/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
